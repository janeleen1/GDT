<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>硬件开发管理工作台（协作版）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='4' y='4' width='16' height='16' rx='2' fill='%2353b9ff'/><rect x='9' y='9' width='6' height='6' fill='%230a0d13'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root[data-theme="dark"]{
  --bg:#0a0d13; --bg-2:#0e1219; --panel:#121722; --panel-2:#1a2230;
  --border:#212b3d; --border-2:#2f3a50;
  --text:#dfe6f1; --text-2:#9aa5b8; --text-3:#64708a;
  --accent:#53b9ff; --accent-dim:rgba(83,185,255,.12);
  --orange:#ffab5e; --green:#52d68a; --purple:#b78cff; --red:#ff7070; --yellow:#ffd66b;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#eef1f6; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f1f4f9;
  --border:#dde3ec; --border-2:#c4ceda;
  --text:#1c2534; --text-2:#57657a; --text-3:#8b97a8;
  --accent:#0f86d6; --accent-dim:rgba(15,134,214,.10);
  --orange:#d97c1f; --green:#1f9d5b; --purple:#8a5cd6; --red:#dc4b4b; --yellow:#b58900;
  --shadow:0 8px 30px rgba(30,45,70,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:13.5px;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.ic{flex-shrink:0}

/* ===== 顶栏 ===== */
.topbar{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bg-2);border-bottom:1px solid var(--border);position:relative;z-index:60}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap}
.brand-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.brand small{display:block;font-size:10.5px;font-weight:500;color:var(--text-3);letter-spacing:.5px}
.searchbox{flex:1;max-width:400px;margin-left:auto;margin-right:auto;position:relative}
.searchbox .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.searchbox input{padding-left:34px;background:var(--panel)}
.topbar-actions{display:flex;gap:8px;align-items:center;white-space:nowrap}

/* ===== 布局 ===== */
.layout{display:flex;height:calc(100% - 56px)}
.sidebar{width:280px;min-width:280px;background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 8px}
.sidebar-head span{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:1px}
.filter-chips{display:flex;gap:6px;padding:6px 14px 10px;flex-wrap:wrap}
.f-chip{font-size:11.5px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);color:var(--text-3);cursor:pointer;background:transparent;white-space:nowrap;transition:.15s}
.f-chip:hover{color:var(--text-2)}
.f-chip.active{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.proj-list{flex:1;overflow-y:auto;padding-bottom:8px}
.proj-item{padding:11px 14px;border-radius:11px;cursor:pointer;border:1px solid transparent;margin:0 10px 6px;transition:.15s}
.proj-item:hover{background:var(--panel)}
.proj-item.active{background:var(--panel);border-color:var(--border-2)}
.proj-item.active .proj-name{color:var(--accent)}
.proj-row1{display:flex;align-items:center;gap:8px}
.proj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.proj-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.proj-sub{font-size:11.5px;color:var(--text-3);margin-top:4px;display:flex;gap:10px;padding-left:16px}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3)}
.main{flex:1;overflow-y:auto;padding:24px 28px}
.main-inner{max-width:1280px;margin:0 auto}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:9px;border:1px solid var(--border-2);background:var(--panel);color:var(--text);font-size:13.5px;cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{filter:brightness(1.1);color:#fff}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn-danger:hover{filter:brightness(1.08);color:#fff}
.btn-danger-ghost{color:var(--red);border-color:transparent;background:transparent}
.btn-danger-ghost:hover{background:rgba(255,112,112,.1);color:var(--red);border-color:transparent}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:8px;color:var(--text-2);cursor:pointer;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.danger:hover{color:var(--red);background:rgba(255,112,112,.12)}

/* ===== 徽标/标签 ===== */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:7px;white-space:nowrap}
.badge.type-proposal{color:var(--accent);background:var(--accent-dim)}
.badge.type-design{color:var(--orange);background:rgba(255,171,94,.13)}
.status-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.status-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.c-blue{color:var(--accent);background:var(--accent-dim)}
.c-orange{color:var(--orange);background:rgba(255,171,94,.13)}
.c-purple{color:var(--purple);background:rgba(183,140,255,.13)}
.c-green{color:var(--green);background:rgba(82,214,138,.12)}
.c-red{color:var(--red);background:rgba(255,112,112,.12)}
.c-gray{color:var(--text-2);background:var(--panel-2)}
.c-yellow{color:var(--yellow);background:rgba(255,214,107,.12)}
.chip{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-dim);padding:2px 9px;border-radius:6px;margin:2px 4px 2px 0}
.ver{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--text-2);background:var(--panel-2);border:1px solid var(--border);padding:2px 8px;border-radius:6px}

/* ===== 项目视图 ===== */
.proj-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.proj-head-info{flex:1;min-width:260px}
.proj-code-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.proj-code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--text-3);letter-spacing:.5px}
.proj-title{font-size:22px;font-weight:700;line-height:1.3}
.proj-desc{color:var(--text-2);margin-top:8px;line-height:1.6;max-width:760px}
.proj-head-ops{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 4px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .num{font-size:21px;font-weight:700;line-height:1.1}
.stat .lbl{font-size:11.5px;color:var(--text-3);margin-top:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:20px 0 20px;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--text-2);font-size:14px;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center;transition:.15s}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .cnt{background:var(--panel-2);border-radius:10px;font-size:11px;padding:1px 8px;color:var(--text-3)}
.view-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.view-bar h2{font-size:16px;font-weight:700}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.rec-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:10px}
.rec-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.rec-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rec-title{font-size:15px;font-weight:650;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:20px}
.rec-tags{min-height:22px}
.rec-card-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-3);border-top:1px solid var(--border);padding-top:10px;margin-top:auto}
.rec-card-foot .att-n{display:inline-flex;align-items:center;gap:5px}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty .empty-ico{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.empty h3{color:var(--text-2);font-size:15.5px;margin-bottom:8px;font-weight:600}
.empty p{font-size:13px;line-height:1.7;max-width:420px;margin:0 auto 18px}
.empty .ic{width:28px;height:28px}

/* ===== 记录详情 ===== */
.detail-topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spacer{flex:1}
.save-state{font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.save-state.saving{color:var(--yellow)}
.save-state.saved{color:var(--green)}
.detail-head{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.detail-title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.detail-title-row h1{font-size:20px;font-weight:700;flex:1;min-width:200px;line-height:1.4}
.ver-big{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--accent);background:var(--accent-dim);padding:3px 12px;border-radius:8px;font-weight:700}
.detail-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--text-3)}
.detail-meta .m{display:inline-flex;align-items:center;gap:5px}
.detail-content{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px 30px;margin-bottom:18px}
.att-section{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px 24px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.section-head h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-head h2 .cnt{font-size:12px;color:var(--text-3);font-weight:500}

/* ===== 编辑表单 ===== */
.edit-grid{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:18px;display:flex;flex-direction:column;gap:16px}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.form-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-cols-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.md-editor{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.md-editor-bar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel-2);flex-wrap:wrap}
.md-hint{font-size:11.5px;color:var(--text-3)}
#recContent{border:none;border-radius:0;min-height:340px;resize:vertical;font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:13.5px;line-height:1.7;background:transparent;padding:16px}
#recContent:focus{border:none}
.md-preview{padding:20px 24px;min-height:340px;max-height:70vh;overflow-y:auto}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.seg button{border:none;background:transparent;color:var(--text-2);padding:4px 14px;border-radius:6px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.seg button.active{background:var(--accent-dim);color:var(--accent);font-weight:600}

/* ===== 附件 ===== */
.dropzone{border:1.5px dashed var(--border-2);border-radius:12px;padding:20px;text-align:center;color:var(--text-3);cursor:pointer;transition:.15s;margin:14px 0;user-select:none}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.dropzone .ic{width:22px;height:22px;margin-bottom:6px}
.dropzone .dz-t{font-size:13px;font-weight:600}
.dropzone .dz-s{font-size:11.5px;margin-top:4px;opacity:.8}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.att-card{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.att-card:hover{border-color:var(--border-2)}
.att-thumb{aspect-ratio:4/3;background:#05070b;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.att-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.att-thumb img[src=""]{display:none}
.att-icon{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;cursor:pointer}
.att-icon .ic{width:34px;height:34px}
.att-icon.kind-pdf{color:var(--red)}
.att-icon.kind-md{color:var(--accent)}
.att-icon.kind-text{color:var(--green)}
.att-icon.kind-other{color:var(--text-3)}
.att-info{padding:8px 11px 9px}
.att-name{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.att-meta{font-size:11px;color:var(--text-3);margin-top:2px}
.att-ops{display:flex;border-top:1px solid var(--border);margin-top:auto}
.att-ops .icon-btn{flex:1;width:auto;border-radius:0;height:34px}
.att-ops .icon-btn+.icon-btn{border-left:1px solid var(--border)}

/* ===== Markdown 渲染 ===== */
.md-body{line-height:1.8;color:var(--text);font-size:14.5px;word-break:break-word}
.md-body h1,.md-body h2,.md-body h3,.md-body h4{margin:1.3em 0 .55em;font-weight:650;line-height:1.4}
.md-body h1{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.md-body h2{font-size:1.3em;padding-bottom:.25em;border-bottom:1px solid var(--border)}
.md-body h3{font-size:1.13em;color:var(--accent)}
.md-body h4{font-size:1em;color:var(--text-2)}
.md-body p{margin:.65em 0}
.md-body ul,.md-body ol{padding-left:1.6em;margin:.6em 0}
.md-body li{margin:.3em 0}
.md-body code{background:var(--panel-2);border:1px solid var(--border);padding:.12em .45em;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:.88em;color:var(--orange)}
.md-body pre{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:.9em 0}
.md-body pre code{background:none;border:none;padding:0;color:var(--text)}
.md-body table{border-collapse:collapse;margin:1em 0;width:100%;font-size:.92em;display:block;overflow-x:auto}
.md-body th,.md-body td{border:1px solid var(--border);padding:7px 13px;text-align:left}
.md-body th{background:var(--panel-2);font-weight:650}
.md-body blockquote{border-left:3px solid var(--accent);background:var(--accent-dim);padding:10px 16px;border-radius:0 8px 8px 0;margin:.9em 0;color:var(--text-2)}
.md-body hr{border:none;border-top:1px solid var(--border);margin:1.6em 0}
.md-body img{max-width:100%;border-radius:10px;border:1px solid var(--border)}
.md-body a{color:var(--accent)}
.md-body strong{font-weight:700}
.md-empty{color:var(--text-3);font-style:italic}
.md-fallback{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

/* ===== Modal ===== */
#modalRoot{display:none}
#modalRoot.show{display:block}
.modal-mask{position:fixed;inset:0;background:rgba(4,7,12,.62);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;animation:fade .15s ease}
.modal{background:var(--bg-2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:500px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pop .18s ease}
.modal-wide{max-width:1080px;height:86vh}
@keyframes pop{from{transform:scale(.96);opacity:0}}
@keyframes fade{from{opacity:0}}
.modal-title{font-size:16px;font-weight:700;padding:20px 24px 0}
.modal-body{padding:16px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:15px}
.modal-actions{padding:0 24px 20px;display:flex;justify-content:flex-end;gap:10px}
.modal-title-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 12px 20px;border-bottom:1px solid var(--border);gap:10px}
.modal-title-row .mt{font-size:14.5px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.pdf-view{flex:1;min-height:0;padding:12px 14px;display:flex}
.pdf-view object{width:100%;border:none;border-radius:8px;flex:1}
.pdf-view .pdf-fallback{margin:auto;text-align:center;color:var(--text-3);font-size:13.5px;line-height:2}
.modal-md{flex:1;min-height:0;overflow-y:auto;padding:20px 26px}
.confirm-msg{color:var(--text-2);line-height:1.7;font-size:13.5px}

/* ===== Lightbox ===== */
#lightbox{position:fixed;inset:0;background:rgba(2,4,8,.92);z-index:120;display:none;align-items:center;justify-content:center}
#lightbox.show{display:flex}
.lb-img{max-width:92vw;max-height:82vh;border-radius:8px;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.lb-close{position:absolute;top:16px;right:16px;color:#fff;background:rgba(255,255,255,.1)}
.lb-close:hover{background:rgba(255,255,255,.22);color:#fff}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;background:rgba(255,255,255,.08);width:44px;height:44px}
.lb-nav:hover{background:rgba(255,255,255,.22);color:#fff}
.lb-nav.prev{left:18px}
.lb-nav.next{right:18px}
.lb-bar{position:absolute;bottom:0;left:0;right:0;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:13px}

/* ===== Toast ===== */
#toastRoot{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--bg-2);border:1px solid var(--border-2);border-left:3px solid var(--green);border-radius:10px;padding:11px 18px;font-size:13px;box-shadow:var(--shadow);animation:slideIn .2s ease;min-width:200px}
.toast.error{border-left-color:var(--red)}
.toast.out{opacity:0;transform:translateX(12px);transition:.3s}

<script>
'use strict';

/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';
const nowIso = () => new Date().toISOString();
function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso), p = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function extOf(name) {
  const m = /\.([a-z0-9]+)$/i.exec(name || '');
  return m ? m[1].toLowerCase() : '';
}

/* ================= 图标 ================= */
const ICONS = {
  chip: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3"/>',

  back: '<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>',

  layers: '<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/><path d="M7 7h.01"/>',
  paperclip: '<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  box: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>',
  sun: '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  chevL: '<path d="M15 18l-6-6 6-6"/>',
  chevR: '<path d="M9 18l6-6-6-6"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  fileCode: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M10 13l-2 2 2 2M14 17l2-2-2-2"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};
function icon(name, size = 16) {
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.file}</svg>`;
}

/* ================= 常量 ================= */
const REC_TYPES = {
  proposal: { label: '方案', icon: 'doc' },
  design:   { label: '设计', icon: 'layers' }
};
const REC_STATUS = {
  draft:     { label: '草稿',   cls: 'c-gray' },
  reviewing: { label: '评审中', cls: 'c-yellow' },
  approved:  { label: '已定稿', cls: 'c-green' },
  obsolete:  { label: '已废弃', cls: 'c-red' }
};
const PROJ_STATUS = {
  planning:   { label: '规划中', cls: 'c-blue',   dot: 'var(--accent)' },
  developing: { label: '开发中', cls: 'c-orange', dot: 'var(--orange)' },
  testing:    { label: '测试中', cls: 'c-purple', dot: 'var(--purple)' },
  done:       { label: '已完成', cls: 'c-green',  dot: 'var(--green)' },
  archived:   { label: '已归档', cls: 'c-gray',   dot: 'var(--text-3)' }
};

/* ================= 状态 ================= */
const state = {
  projects: [],
  records: [],
  view: 'project',           // project | record
  currentProjectId: null,
  currentTab: 'proposal',    // proposal | design | files
  editingRecordId: null,
  editing: false,
  search: '',
  projectFilter: 'all',
  fileKind: 'all',
  mdPreviewOn: false
};
let saveTimer = null;
const localEdits = new Set();
const urlCache = new Map();

/* ================= Supabase 接入 ================= */
const SB = (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url && window.SUPABASE_CONFIG.anonKey && window.supabase)
  ? window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey)
  : null;

async function loadAll() {
  const [pr, rr] = await Promise.all([
    SB.from('hw_projects').select('data'),
    SB.from('hw_records').select('data')
  ]);
  if (pr.error) throw new Error(pr.error.message);
  if (rr.error) throw new Error(rr.error.message);
  return { projects: (pr.data || []).map(x => x.data), records: (rr.data || []).map(x => x.data) };
}
const API = {
  load: loadAll,
  async saveProject(p) {
    p.updatedAt = nowIso();
    const { error } = await SB.from('hw_projects').upsert({ id: p.id, data: p, updated_at: p.updatedAt });
    if (error) throw new Error(error.message);
  },
  async removeProject(id) {
    const { error } = await SB.from('hw_projects').delete().eq('id', id);
    if (error) throw new Error(error.message);
  },
  async saveRecord(r) {
    r.updatedAt = nowIso();
    const { error } = await SB.from('hw_records').upsert({ id: r.id, data: r, updated_at: r.updatedAt });
    if (error) throw new Error(error.message);
  },
  async removeRecord(id) {
    const { error } = await SB.from('hw_records').delete().eq('id', id);
    if (error) throw new Error(error.message);
  },
  async uploadFile(id, file) {
    const { error } = await SB.storage.from('hwfiles').upload(id, file, { upsert: true, contentType: file.type || 'application/octet-stream' });
    if (error) throw new Error(error.message);
  },
  async removeFile(id) {
    const { error } = await SB.storage.from('hwfiles').remove([id]);
    if (error) throw new Error(error.message);
  }
};
async function fileUrl(attId, download) {
  const key = attId + (download ? '#dl' : '');
  const c = urlCache.get(key);
  if (c && c.exp > Date.now() + 60000) return c.url;
  const { data, error } = await SB.storage.from('hwfiles').createSignedUrl(attId, 3600, download ? { download: true } : {});
  if (error || !data) return null;
  urlCache.set(key, { url: data.signedUrl, exp: Date.now() + 55 * 60 * 1000 });
  return data.signedUrl;
}

/* ================= 登录与云端同步 ================= */
function setSyncState(ok) {
  const el = $('#syncState');
  if (!el) return;
  el.classList.toggle('off', !ok);
  el.innerHTML = '<span class="dot"></span>' + (ok ? '已同步' : '连接断开');
}
function loginError(msg) {
  const el = $('#loginError');
  if (el) el.textContent = msg || '';
}
let syncing = false;
async function refreshLoop() {
  if (!SB || syncing) return;
  syncing = true;
  try {
    const d = await API.load();
    setSyncState(true);
    const mergedP = d.projects.map(sp => localEdits.has(sp.id) ? (state.projects.find(p => p.id === sp.id) || sp) : sp);
    const mergedR = d.records.map(sr => localEdits.has(sr.id) ? (state.records.find(r => r.id === sr.id) || sr) : sr);
    const before = JSON.stringify([state.projects, state.records]);
    state.projects = mergedP;
    state.records = mergedR;
    if (before !== JSON.stringify([state.projects, state.records])) {
      if (state.editing) renderSidebar(); else renderAll();
    }
  } catch (e) { setSyncState(false); }
  syncing = false;
}
async function startApp(user) {
  document.body.classList.remove('pre-auth');
  $('#loginOverlay').style.display = 'none';
  const chip = $('#userEmail');
  if (chip) chip.textContent = user.email || '已登录';
  try {
    const d = await API.load();
    state.projects = d.projects;
    state.records = d.records;
    if (!state.projects.length) {
      await seedDemo();
    } else {
      const last = localStorage.getItem('hwdev-last-project');
      state.currentProjectId = state.projects.some(p => p.id === last) ? last : state.projects[0]?.id || null;
    }
    setSyncState(true);
    renderAll();
  } catch (e) {
    setSyncState(false);
    toast('数据加载失败：' + e.message, 'error');
  }
  setInterval(refreshLoop, 5000);
}
async function doSignIn() {
  loginError('');
  const email = $('#loginEmail').value.trim();
  const pass = $('#loginPass').value;
  if (!email || !pass) { loginError('请填写邮箱和密码'); return; }
  const { error } = await SB.auth.signInWithPassword({ email, password: pass });
  if (error) { loginError(error.message); return; }
  const { data: { session } } = await SB.auth.getSession();
  if (session) startApp(session.user);
}
async function doSignUp() {
  loginError('');
  const email = $('#loginEmail').value.trim();
  const pass = $('#loginPass').value;
  if (!email || !pass) { loginError('请填写邮箱和密码'); return; }
  if (pass.length < 6) { loginError('密码至少 6 位'); return; }
  const { data, error } = await SB.auth.signUp({ email, password: pass });
  if (error) { loginError(error.message); return; }
  if (data.session) startApp(data.session.user);
  else loginError('注册成功，请到邮箱点击确认链接后再登录');
}

/* ================= Markdown ================= */
if (window.marked && marked.setOptions) marked.setOptions({ breaks: true, gfm: true });
function renderMd(text) {
  if (!text || !text.trim()) return '<p class="md-empty">暂无内容，点击「编辑」开始撰写（支持 Markdown 语法）。</p>';
  if (window.marked && window.DOMPurify) {
    try { return DOMPurify.sanitize(marked.parse(text)); } catch (e) { /* fallthrough */ }
  }
  return '<pre class="md-fallback">' + esc(text) + '</pre>';
}

/* ================= Toast / Modal ================= */
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2600);
}
let modalDismissable = true;
function openModal(html, opts = {}) {
  modalDismissable = opts.dismissable !== false;
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-mask" id="modalMask"><div class="modal ${opts.wide ? 'modal-wide' : ''}">${html}</div></div>`;
  root.classList.add('show');
}
function closeModal() {
  $('#modalRoot').classList.remove('show');
  $('#modalRoot').innerHTML = '';
}
function confirmDialog(title, msg, danger = true) {
  return new Promise(resolve => {
    openModal(`
      <div class="modal-title">${esc(title)}</div>
      <div class="modal-body"><div class="confirm-msg">${esc(msg)}</div></div>
      <div class="modal-actions">
        <button class="btn" data-role="cancel">取消</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-role="ok">确定</button>
      </div>`, { dismissable: true });
    $('#modalRoot').querySelectorAll('[data-role]').forEach(b => {
      b.onclick = () => { closeModal(); resolve(b.dataset.role === 'ok'); };
    });
  });
}

/* ================= 数据访问 ================= */
const currentProject = () => state.projects.find(p => p.id === state.currentProjectId) || null;
const getEditingRecord = () => state.records.find(r => r.id === state.editingRecordId) || null;
const projectRecords = pid => state.records
  .filter(r => r.projectId === pid)
  .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
function searchMatch(text) {
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  return (text || '').toLowerCase().includes(q);
}
function recordMatches(r) {
  return searchMatch(r.title) || searchMatch(r.version) || searchMatch((r.tags || []).join(' ')) || searchMatch(r.content);
}
function attKind(att) {
  if ((att.mime || '').startsWith('image/')) return 'image';
  if (att.mime === 'application/pdf' || att.ext === 'pdf') return 'pdf';
  if (['md', 'markdown'].includes(att.ext) || att.mime === 'text/markdown') return 'md';
  if ((att.mime || '').startsWith('text/')) return 'text';
  return 'other';
}
const KIND_ICON = { image: 'image', pdf: 'file', md: 'fileCode', text: 'doc', other: 'box' };
const KIND_LABEL = { image: '图片', pdf: 'PDF', md: 'Markdown', text: '文本', other: '其他' };

/* ================= 渲染 ================= */
function renderAll() { renderSidebar(); renderMain(); }

function renderSidebar() {
  const chips = ['all', ...Object.keys(PROJ_STATUS)].map(k =>
    `<button class="f-chip ${state.projectFilter === k ? 'active' : ''}" data-action="filter-project" data-val="${k}">${k === 'all' ? '全部' : PROJ_STATUS[k].label}</button>`
  ).join('');
  $('#filterChips').innerHTML = chips;

  let list = state.projects
    .filter(p => state.projectFilter === 'all' || p.status === state.projectFilter)
    .filter(p => !state.search || searchMatch(p.name) || searchMatch(p.code) || searchMatch(p.description))
    .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

  if (!state.projects.length) {

  return `
    <div class="view-bar">

function renderAttachmentsArea() {
  const r = getEditingRecord();
  if (!r || state.view !== 'record') return;
  const grid = $('#attGrid');
  const sec = document.querySelector('.att-section');
  if (!sec) return;
  const attN = (r.attachments || []).length;
  sec.querySelector('.section-head h2 .cnt').textContent = `${attN} 个 · 支持图片 / PDF / Markdown`;
  if (grid) grid.innerHTML = (r.attachments || []).map(a => attCard(a, r)).join('');
  else if (attN) {
    const dz = sec.querySelector('.dropzone');
    dz.insertAdjacentHTML('afterend', `<div class="att-grid" id="attGrid">${(r.attachments || []).map(a => attCard(a, r)).join('')}</div>`);
  }
  hydrateThumbs(sec);
}

function hydrateThumbs(scope) {
  scope.querySelectorAll('.att-thumb img').forEach(async img => {
    const holder = img.closest('.att-thumb');
    if (!holder || !holder.dataset.id || img.src) return;
    const url = await fileUrl(holder.dataset.id);
    if (url) img.src = url;
  });
}

/* ================= 业务操作 ================= */
function setSaveState(cls) {
  const el = $('#saveState');
  if (!el) return;
  el.className = 'save-state ' + cls;
  el.innerHTML = cls === 'saving' ? icon('clock', 13) + '保存中…' : cls === 'error' ? icon('x', 13) + '保存失败' : icon('check', 13) + '已保存';
}
function scheduleSave() {
  setSaveState('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const r = getEditingRecord();
    if (!r) return;
    localEdits.add(r.id);
    r.updatedAt = nowIso();
    try {
      await API.saveRecord(r);
      localEdits.delete(r.id);
      setSaveState('saved');
      renderSidebar();
    } catch (e) { setSaveState('error'); toast('保存失败：' + e.message, 'error'); }
  }, 700);
}

async function newRecord(type) {
  const p = currentProject();
  if (!p) return;
  const r = {
    id: uid('r'), projectId: p.id, type,
    title: type === 'proposal' ? '未命名方案' : '未命名设计',
    version: 'V0.1', status: 'draft', tags: [], content: '',
    attachments: [], createdAt: nowIso(), updatedAt: nowIso()
  };
  p.updatedAt = nowIso();
  try {
    await API.saveRecord(r);
    await API.saveProject(p);
  } catch (e) { toast('创建失败：' + e.message, 'error'); return; }
  state.records.push(r);
  state.view = 'record'; state.editingRecordId = r.id; state.editing = true; state.mdPreviewOn = false;
  renderAll();
  const inp = document.querySelector('.rec-edit-field[data-field="title"]');
  if (inp) { inp.focus(); inp.select(); }
}

async function deleteRecord(id) {
  const r = state.records.find(x => x.id === id);
  if (!r) return;
  const ok = await confirmDialog('删除记录', `确定删除「${r.title}」？其下 ${(r.attachments || []).length} 个附件将一并删除，且不可恢复。`);
  if (!ok) return;
  try {
    for (const a of (r.attachments || [])) { try { await API.removeFile(a.id); } catch (e) {} }
    await API.removeRecord(id);
  } catch (e) { toast('删除失败：' + e.message, 'error'); return; }
  state.records = state.records.filter(x => x.id !== id);
  state.view = 'project'; state.editingRecordId = null; state.editing = false;
  renderAll();
  toast('记录已删除');
}

async function uploadFiles(fileList) {
  const r = getEditingRecord();
  if (!r) { toast('请先打开一条记录再上传附件', 'error'); return; }
  let n = 0;
  try {
    for (const f of fileList) {
      const id = uid('f');
      await API.uploadFile(id, f);
      r.attachments = r.attachments || [];
      r.attachments.push({ id, name: f.name, mime: f.type || 'application/octet-stream', size: f.size, ext: extOf(f.name) });
      n++;
    }
    await API.saveRecord(r);
  } catch (e) {
    toast('上传失败：' + e.message, 'error');
    renderAttachmentsArea();
    return;
  }
  renderAttachmentsArea();
  renderSidebar();
  toast(`已上传 ${n} 个文件`);
}

async function deleteAttachment(attId, recordId) {
  const r = state.records.find(x => x.id === (recordId || state.editingRecordId));
  if (!r) return;
  const att = (r.attachments || []).find(a => a.id === attId);
  if (!att) return;
  const ok = await confirmDialog('删除附件', `确定删除「${att.name}」？此操作不可恢复。`);
  if (!ok) return;
  try {
    await API.removeFile(attId);
    r.attachments = (r.attachments || []).filter(a => a.id !== attId);
    await API.saveRecord(r);
  } catch (e) { toast('删除失败：' + e.message, 'error'); return; }
  urlCache.delete(attId);
  urlCache.delete(attId + '#dl');
  if (state.view === 'record' && state.editingRecordId === r.id) renderAttachmentsArea();
  else renderMain();
  renderSidebar();
  toast('附件已删除');
}

async function downloadAttachment(att) {
  const url = await fileUrl(att.id, true);
  if (!url) { toast('文件不存在', 'error'); return; }
  window.open(url, '_blank');
}

async function viewAttachment(att, record) {
  const kind = attKind(att);
  if (kind === 'image') { openLightbox(att, record); return; }
  const url = await fileUrl(att.id);
  if (!url) { toast('文件不存在', 'error'); return; }
  const titleHtml = `<div class="modal-title-row"><div class="mt">${icon(KIND_ICON[kind], 16)}${esc(att.name)}</div>
    <div style="display:flex;gap:8px"><button class="icon-btn" data-action="att-download" data-id="${att.id}" title="下载">${icon('download', 16)}</button>
    <button class="icon-btn" data-modal-close title="关闭">${icon('x', 16)}</button></div></div>`;
  if (kind === 'pdf') {
    openModal(`${titleHtml}<div class="pdf-view"><object data="${url}" type="application/pdf">
      <div class="pdf-fallback">当前浏览器不支持内嵌 PDF 预览<br>请点击右上角下载按钮保存后查看</div></object></div>`, { wide: true });
  } else if (kind === 'md' || kind === 'text') {
    const resp = await fetch(url);
    const text = await resp.text();
    openModal(`${titleHtml}<div class="modal-md md-body">${renderMd(text)}</div>`, { wide: true });
  } else {
    downloadAttachment(att);
  }
}

/* ---------- Lightbox ---------- */
let lbState = null;
async function openLightbox(att, record) {
  const list = record ? (record.attachments || []).filter(a => attKind(a) === 'image') : [att];
  lbState = { list: list.length ? list : [att], idx: Math.max(0, list.findIndex(a => a.id === att.id)) };
  $('#lightbox').classList.add('show');
  renderLightbox();
}
async function renderLightbox() {
  const { list, idx } = lbState;
  const a = list[idx];
  if (!a) return;
  const url = await fileUrl(a.id);
  $('#lightbox').innerHTML = `
    <button class="icon-btn lb-close" data-lb="close">${icon('x', 20)}</button>
    ${list.length > 1 ? `<button class="icon-btn lb-nav prev" data-lb="prev">${icon('chevL', 20)}</button>
    <button class="icon-btn lb-nav next" data-lb="next">${icon('chevR', 20)}</button>` : ''}
    <img class="lb-img" src="${url}" alt="${esc(a.name)}">
    <div class="lb-bar"><span>${esc(a.name)}</span><span>${idx + 1} / ${list.length}</span></div>`;
}
$('#lightbox').addEventListener('click', async e => {
  const el = e.target.closest('[data-lb]');
  if (!el) { if (e.target.id === 'lightbox') { $('#lightbox').classList.remove('show'); lbState = null; } return; }
  const v = el.dataset.lb;
  if (v === 'close') { $('#lightbox').classList.remove('show'); lbState = null; }
  else if (v === 'prev') { lbState.idx = (lbState.idx - 1 + lbState.list.length) % lbState.list.length; renderLightbox(); }
  else if (v === 'next') { lbState.idx = (lbState.idx + 1) % lbState.list.length; renderLightbox(); }
});

      <div class="form-row"><label>项目名称 *</label><input id="pmName" value="${esc(p?.name || '')}" placeholder="如：智能环境监测终端"></div>
      <div class="form-cols-2">
        <div class="form-row"><label>项目编号</label><input id="pmCode" value="${esc(p?.code || '')}" placeholder="HW-2026-001"></div>
        <div class="form-row"><label>状态</label>
          <select id="pmStatus">${Object.entries(PROJ_STATUS).map(([k, v]) => `<option value="${k}" ${(p?.status || 'planning') === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div>
      </div>
      <div class="form-row"><label>描述</label><textarea id="pmDesc" rows="3" placeholder="项目目标、硬件平台、关键约束等">${esc(p?.description || '')}</textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn" data-role="cancel">取消</button>
      <button class="btn btn-primary" data-role="ok">${p ? '保存' : '创建'}</button>
    </div>`, { dismissable: false });
  const root = $('#modalRoot');
  root.querySelector('[data-role="cancel"]').onclick = closeModal;
  root.querySelector('[data-role="ok"]').onclick = async () => {
    const name = root.querySelector('#pmName').value.trim();
    if (!name) { toast('请填写项目名称', 'error'); root.querySelector('#pmName').focus(); return; }
    const data = {
      name,
      code: root.querySelector('#pmCode').value.trim(),
      status: root.querySelector('#pmStatus').value,
      description: root.querySelector('#pmDesc').value.trim()
    };
    if (p) {
      Object.assign(p, data, { updatedAt: nowIso() });
      try { await API.saveProject(p); } catch (e) { toast('保存失败：' + e.message, 'error'); return; }
      toast('项目已更新');
    } else {
      const np = { id: uid('p'), ...data, createdAt: nowIso(), updatedAt: nowIso() };
      try { await API.saveProject(np); } catch (e) { toast('创建失败：' + e.message, 'error'); return; }
      state.projects.push(np);
      state.currentProjectId = np.id;
      localStorage.setItem('hwdev-last-project', np.id);
      state.view = 'project'; state.currentTab = 'proposal';
      toast('项目已创建');
    }
    closeModal();
    renderAll();
  };
  setTimeout(() => root.querySelector('#pmName').focus(), 50);
}

async function deleteProject(id) {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  const recs = state.records.filter(r => r.projectId === id);
  const attN = recs.reduce((s, r) => s + (r.attachments || []).length, 0);
  const ok = await confirmDialog('删除项目', `确定删除项目「${p.name}」？包含 ${recs.length} 条记录、${attN} 个附件，全部数据将不可恢复。`);
  if (!ok) return;
  try {
    for (const r of recs) {
      for (const a of (r.attachments || [])) { try { await API.removeFile(a.id); } catch (e) {} }
      await API.removeRecord(r.id);
    }
    await API.removeProject(id);
  } catch (e) { toast('删除失败：' + e.message, 'error'); return; }
  state.records = state.records.filter(r => r.projectId !== id);
  state.projects = state.projects.filter(x => x.id !== id);
  if (state.currentProjectId === id) {
    state.currentProjectId = state.projects[0]?.id || null;
    state.view = 'project'; state.editing = false; state.editingRecordId = null;
  }
  renderAll();
  toast('项目已删除');
}

/* ---------- 备份 ---------- */
function blobToBase64(b) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
}
function dataUrlToBlob(d) {
  const i = d.indexOf(','), head = d.slice(0, i), data = atob(d.slice(i + 1));
  const mime = (head.match(/:(.*?);/) || [])[1] || 'application/octet-stream';
  const arr = new Uint8Array(data.length);
  for (let j = 0; j < data.length; j++) arr[j] = data.charCodeAt(j);
  return new Blob([arr], { type: mime });
}
async function exportBackup() {
  try {
    toast('正在生成备份…');
    const files = [];
    for (const r of state.records) {
      for (const a of (r.attachments || [])) {
        const url = await fileUrl(a.id);
        if (!url) continue;
        const blob = await (await fetch(url)).blob();
        files.push({ id: a.id, name: a.name, mime: a.mime, size: a.size, data: await blobToBase64(blob) });
      }
    }
    const out = {
      app: 'hwdev-manager', version: 1, exportedAt: nowIso(),
      projects: state.projects, records: state.records, files
    };
    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date(), pd = x => String(x).padStart(2, '0');
    a.download = `硬件开发备份_${d.getFullYear()}${pd(d.getMonth() + 1)}${pd(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('备份已导出');
  } catch (e) { toast('导出失败：' + e.message, 'error'); }
}
async function importBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('文件解析失败，请确认是有效的备份 JSON', 'error'); return; }
  if (data.app !== 'hwdev-manager' || !Array.isArray(data.projects)) { toast('不是有效的硬件开发管理备份文件', 'error'); return; }
  const ok = await confirmDialog('导入备份', `将替换云端当前全部数据（${state.projects.length} 个项目、${state.records.length} 条记录）为备份内容（${data.projects.length} 个项目、${(data.records || []).length} 条记录），对所有协作者生效，确定继续？`);
  if (!ok) return;
  try {
    toast('正在导入…');
    const { data: existing } = await SB.storage.from('hwfiles').list();
    if (existing && existing.length) await SB.storage.from('hwfiles').remove(existing.map(f => f.name));
    for (const r of state.records) await API.removeRecord(r.id);
    for (const p of state.projects) await API.removeProject(p.id);
    urlCache.clear();
    state.projects = data.projects;
    state.records = data.records || [];
    for (const p of state.projects) await API.saveProject(p);
    for (const r of state.records) await API.saveRecord(r);
    for (const f of (data.files || [])) await API.uploadFile(f.id, dataUrlToBlob(f.data));
    state.currentProjectId = state.projects[0]?.id || null;
    state.view = 'project'; state.editing = false; state.editingRecordId = null;
    renderAll();
    toast('备份导入成功');
  } catch (e) { toast('导入失败：' + e.message, 'error'); }
}

async function seedDemo() {
  const p = {
    id: uid('p'), name: '示例：智能环境监测终端', code: 'HW-2026-001',
    description: '基于 ESP32-S3 的多传感器环境监测设备。此为演示项目，可随意编辑或删除。',

  };
  const r1 = {

    version: 'V1.2', status: 'approved', tags: ['方案', '选型', '架构'], attachments: [],
    createdAt: nowIso(), updatedAt: nowIso(),
    content: `# 总体技术方案

## 1. 需求概述
面向室内环境质量监测场景，采集温湿度、CO₂、PM2.5 与 TVOC 数据，本地显示并上报云端。

## 2. 系统架构

- **主控**：ESP32-S3-WROOM-1（N16R8），双核 240MHz，自带 Wi-Fi / BLE
- **传感**：SHT40（温湿度）、SCD41（CO₂）、PMS5003（颗粒物）、SGP40（TVOC）
- **电源**：USB-C 5V 输入，MP2359 降压至 3.3V，预留 18650 锂电池备份
- **显示**：2.13 寸墨水屏（SPI）

## 3. 关键选型对比

| 器件 | 候选 A | 候选 B | 结论 |
|------|--------|--------|------|
| 主控 | ESP32-S3 | STM32+Wi-Fi 模组 | 选 S3，集成度高 |
| CO₂ 传感 | SCD41 | MH-Z19B | 选 SCD41，低功耗、小体积 |
| 电源 | MP2359 | AMS1117 | 选 MP2359，效率高 |

## 4. 接口分配
> I²C 总线挂载 SHT40 / SCD41 / SGP40（地址无冲突），墨水屏与 PMS5003 走 UART/SPI。

## 5. 风险与对策
- CO₂ 传感器自校准在通风不良环境漂移 → 预留强制校准命令
- 墨水屏刷新率低 → 数据变化阈值触发刷新
`
  };
  const r2 = {
    id: uid('r'), projectId: p.id, type: 'design', title: '电源与主控电路设计',
    version: 'V1.0', status: 'reviewing', tags: ['原理图', '电源', 'MCU'], attachments: [],
    createdAt: nowIso(), updatedAt: nowIso(),

## 电源树

\`\`\`
USB 5V ──> MP2359 (3.3V/2A) ──> 主控 / 传感器 / 墨水屏
      └──> TP4056 ──> 18650 ──> MT3608 升压 5V（备份回路）
\`\`\`

## 设计要点

1. MP2359 输入端并联 22uF X5R 电容 ×2，抑制纹波
2. ESP32-S3 电源引脚就近放置 100nF + 10uF 去耦
3. Wi-Fi PA 峰值电流 ~500mA，LDO 需满足瞬态响应
4. USB D+/D- 差分走线 90Ω 控制，ESD 器件靠近连接器

## GPIO 分配（草案）

| 引脚 | 功能 | 备注 |
|------|------|------|
| GPIO8/9 | I²C SDA/SCL | 4.7k 上拉 |
| GPIO10~14 | 墨水屏 SPI | 含 BUSY/RES |
| GPIO17/18 | UART2 | PMS5003 |
| GPIO6 | ADC1 | 电池电压检测 |

## 待确认
- [ ] 备份电池回路是否保留（成本 +3.2 元）
- [ ] 墨水屏连接器改 FPC 还是排针
`
  };
  await API.saveProject(p);

/* ================= 事件绑定 ================= */
$('#main').addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action;
  const id = el.dataset.id;
  switch (act) {
    case 'new-project': projectModal(null); break;
    case 'edit-project': projectModal(currentProject()); break;
    case 'del-project': deleteProject(currentProject()?.id); break;
    case 'open-project': {
      state.currentProjectId = el.dataset.id;
      state.view = 'project'; state.editing = false; state.editingRecordId = null;
      localStorage.setItem('hwdev-last-project', state.currentProjectId);
      $('#sidebar').classList.remove('open'); $('#sbMask').classList.remove('show');
      renderAll(); break;
    }
    case 'filter-project': state.projectFilter = el.dataset.val; renderSidebar(); break;
    case 'tab': state.currentTab = el.dataset.val; renderMain(); break;
    case 'file-kind': state.fileKind = el.dataset.val; renderMain(); break;
    case 'new-record': newRecord(el.dataset.val); break;
    case 'open-record': {
      state.view = 'record'; state.editingRecordId = id; state.editing = false; state.mdPreviewOn = false;
      renderMain(); break;
    }
    case 'toggle-edit': state.editing = !state.editing; state.mdPreviewOn = false; renderMain(); break;
    case 'back': state.view = 'project'; state.editing = false; state.editingRecordId = null; renderMain(); break;
    case 'del-record': deleteRecord(id); break;
    case 'md-tab': {
      state.mdPreviewOn = el.dataset.val === 'preview';
      const ta = $('#recContent'), pv = $('#mdPreview');
      if (ta && pv) {
        ta.hidden = state.mdPreviewOn;
        pv.hidden = !state.mdPreviewOn;
        if (state.mdPreviewOn) pv.innerHTML = renderMd(getEditingRecord()?.content);
        document.querySelectorAll('.md-editor-bar .seg button').forEach(b =>
          b.classList.toggle('active', b.dataset.val === el.dataset.val));
      }
      break;
    }
    case 'upload': $('#fileInput').click(); break;
    case 'att-view': {
      const rec = state.records.find(r => r.id === el.dataset.rec);
      const att = rec?.attachments?.find(a => a.id === id);
      if (att) viewAttachment(att, rec);
      break;
    }
    case 'att-download': {
      const r = getEditingRecord();
      const att = r?.attachments?.find(a => a.id === id) || findAttGlobal(id);
      if (att) downloadAttachment(att);
      break;
    }
    case 'att-del': deleteAttachment(id, el.dataset.rec); break;
  }
});
function findAttGlobal(attId) {
  for (const r of state.records) {
    const a = (r.attachments || []).find(x => x.id === attId);
    if (a) return a;
  }
  return null;
}

/* 侧栏事件（项目选择 / 状态筛选） */
$('#sidebar').addEventListener('click', e => {

  if (!el) return;
  if (el.dataset.action === 'open-project') {
    state.currentProjectId = el.dataset.id;
    state.view = 'project'; state.editing = false; state.editingRecordId = null;
    localStorage.setItem('hwdev-last-project', state.currentProjectId);
    $('#sidebar').classList.remove('open'); $('#sbMask').classList.remove('show');
    renderAll();
  } else if (el.dataset.action === 'filter-project') {
    state.projectFilter = el.dataset.val;

  }
});

$('#main').addEventListener('input', e => {
  const el = e.target;
  if (!el.matches('.rec-edit-field')) return;
  const r = getEditingRecord();
  if (!r) return;
  const field = el.dataset.field;
  if (field === 'tags') r.tags = el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  else r[field] = el.value;
  if (field === 'content' && state.mdPreviewOn && $('#mdPreview')) $('#mdPreview').innerHTML = renderMd(r.content);

});
$('#main').addEventListener('change', e => {

/* 文件上传 */
$('#fileInput').addEventListener('change', e => {
  if (e.target.files?.length) uploadFiles([...e.target.files]);
  e.target.value = '';
});
$('#btnImport').addEventListener('click', () => $('#importInput').click());
$('#importInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => importBackup(reader.result);
  reader.readAsText(f);
  e.target.value = '';
});
$('#btnExport').addEventListener('click', exportBackup);
$('#btnNewProject').addEventListener('click', () => projectModal(null));

/* 搜索 */
let searchTimer = null;
$('#globalSearch').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value;
    if (state.view === 'record') state.view = 'project';
    renderAll();
  }, 180);
});

/* 拖拽上传 */
let dragTimer = null;
document.addEventListener('dragover', e => {
  e.preventDefault();
  if (state.view === 'record') {
    document.querySelector('.dropzone')?.classList.add('drag');
    clearTimeout(dragTimer);
    dragTimer = setTimeout(() => document.querySelector('.dropzone')?.classList.remove('drag'), 400);
  }
});
document.addEventListener('drop', e => {
  e.preventDefault();
  document.querySelector('.dropzone')?.classList.remove('drag');
  if (state.view === 'record' && e.dataTransfer?.files?.length) uploadFiles([...e.dataTransfer.files]);
});

/* 粘贴图片上传 */
document.addEventListener('paste', e => {
  if (state.view !== 'record') return;
  const ta = e.target;
  if (!ta || !ta.closest || !ta.closest('.md-editor')) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) {
    e.preventDefault();
    uploadFiles(files);
    toast('截图已添加为附件');
  }
});

/* Modal 关闭与内部操作 */
$('#modalRoot').addEventListener('click', e => {
